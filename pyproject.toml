[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fit"
version = "0.1.0"
description = "Generate Fitted Information Trees from markdown documents"
requires-python = ">=3.10"
dependencies = [
    "markdown-it-py>=3.0.0",
    "pygments>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
fit = "fit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "griffonner>=0.3.5",
    "pytest>=9.0.3",
]
